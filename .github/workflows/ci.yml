name: CI

# Runs on every pull request and on every push to main / dev.
# The final job "CI Passed" is the ONE check that branch protection requires.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - name: Check code style
        run: flake8 booking-service payment-service

  test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: booking-service/requirements.txt
      - name: Install dependencies
        run: pip install -r booking-service/requirements.txt pytest-cov
      - name: Run tests with coverage
        working-directory: booking-service
        run: python -m pytest -q --cov=app --junitxml=test-report.xml
      - name: Coverage summary
        if: always()
        working-directory: booking-service
        run: |
          echo "### Backend test coverage" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: booking-service/test-report.xml

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax check (inline scripts in index.html)
        run: |
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("frontend/index.html", "utf8");
            const scripts = [...html.matchAll(/<script(?![^>]*\ssrc=)[^>]*>([\s\S]*?)<\/script>/g)];
            if (!scripts.length) { console.error("No inline script found"); process.exit(1); }
            scripts.forEach((m, i) => fs.writeFileSync(`/tmp/inline-${i}.js`, m[1]));
            console.log(`Found ${scripts.length} inline script(s)`);
          '
          for f in /tmp/inline-*.js; do node --check "$f" && echo "OK $f"; done

  integration:
    name: Docker integration test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and start the whole stack (db, payment, booking, frontend, mail)
        run: docker compose up -d --build
      - name: Smoke test through the frontend (browse, login, register, QR, check-in)
        run: bash scripts/smoke-test.sh http://localhost:8080/api
      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail=80
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform validate (info only)
    runs-on: ubuntu-latest
    continue-on-error: true   # informational: does not block merging
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # Branch protection requires only this job. It is green only when all required jobs passed.
  ci-passed:
    name: CI Passed
    needs: [lint, test, frontend, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results of required jobs
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} frontend=${{ needs.frontend.result }} integration=${{ needs.integration.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.test.result }}" != "success" ] \
             || [ "${{ needs.frontend.result }}" != "success" ] || [ "${{ needs.integration.result }}" != "success" ]; then
            echo "One or more required jobs did not pass"; exit 1
          fi
