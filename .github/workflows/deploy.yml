name: Release

# Runs when code is merged into main (merges only happen through reviewed Pull Requests).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Push ${{ matrix.service }} image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [booking-service, payment-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker image names must be all lowercase, but GitHub usernames can contain capitals
      - name: Lower-case the image name
        id: img
        run: echo "name=$(echo 'ghcr.io/${{ github.repository }}/${{ matrix.service }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  deploy:
    name: Deploy to server
    needs: publish
    # Skipped until you create the repository variable DEPLOY_ENABLED = true
    # (Settings > Secrets and variables > Actions > Variables) once a server is ready.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull the new code and restart the containers over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/fest-ticketing
            git pull origin main
            docker compose up -d --build
      - name: Check the deployed site is healthy
        run: |
          for i in $(seq 1 20); do
            if curl -sf "http://${{ secrets.DEPLOY_HOST }}:8080/api/health"; then echo; echo "Deployment healthy"; exit 0; fi
            sleep 6
          done
          echo "Deployed site did not become healthy"; exit 1
